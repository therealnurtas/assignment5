<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task 1 — Code Breaker</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/task1.js" defer></script>
</head>
<body>
<header class="site-header"><nav aria-label="Main">
  <a href="index.html">Home</a>
  <a href="task1.html" aria-current="page">Task 1 · Code Breaker</a>
  <a href="task2.html">Task 2 · Kanban</a>
  <a href="task3.html">Task 3 · Ticket Builder</a>
</nav></header>
<main class="container">
  <h1>Task 1 · Code Breaker</h1>
  <p id="rules" class="muted"></p>
  <section id="game" class="card" aria-labelledby="game-title">
    <h2 id="game-title">Crack the code</h2>
    <div class="status-row">
      <span>Attempts left: <span id="attempts-left">0</span></span>
      <span>Attempts used: <span id="attempts-used">0</span></span>
      <span>Status: <span id="game-status">Playing</span></span>
    </div>
    <form id="guess-form" class="guess-form" novalidate>
      <div class="field">
        <label for="guess">Your guess</label>
        <input id="guess" name="guess" type="text" inputmode="numeric" autocomplete="off" aria-describedby="message">
      </div>
      <button id="guess-btn" class="btn" type="submit">Guess</button>
      <button id="restart-btn" class="btn secondary" type="button">New game</button>
    </form>
    <p id="message" class="message" role="status" aria-live="polite"></p>
    <div class="table-wrap">
      <table>
        <caption>History of guesses</caption>
        <thead><tr><th scope="col">#</th><th scope="col">Guess</th><th scope="col">Right place</th><th scope="col">Wrong place</th></tr></thead>
        <tbody id="history"></tbody>
      </table>
    </div>
  </section>
</main>
</body></html>
